# R4-N11 cert-manager Certificate: key algorithm and size requested from the cluster CA.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: qx-api
  namespace: qx
spec:
  secretName: qx-api-tls
  dnsNames:
    - api.qx.example.com
  issuerRef:
    name: qx-internal-ca
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Never
